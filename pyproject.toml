[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-lattice"
version = "0.1.0"
description = "Unit-cell geometry, densities and powder-XRD peak positions"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luis Rodriguez" }]
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyter"]

[tool.setuptools]
packages = ["crystallo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
